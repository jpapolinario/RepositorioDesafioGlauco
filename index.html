<!--Tela inicial, com links de navegação-->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Glauco</title>
</head>

<body>
    <h1>Cadastro de usuário</h1>

    <form>
        <label for="nome">Nome:</label>
        <input type="text" id="nome">

        <label for="dataNascimento">Data de nascimento:</label>
        <input type="date" id="dataNascimento" onchange="calcularIdade()">

        <label for="idade">Idade:</label>
        <input type="number" id="idade" readonly>

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" maxlength="14" oninput="mascaraCpf()">

        <label for="sexo">Sexo:</label>
        <select id="sexo">
            <option value="">Selecione</option>
            <option value="Masculino">Masculino</option>
            <option value="Feminino">Feminino</option>
            <option value="Outro">Outro</option>
        </select>

        <label for="estadoCivil">Estado Civil:</label>
        <select id="estadoCivil">
            <option value="">Selecione</option>
            <option value="Solteiro">Solteiro</option>
            <option value="Casado">Casado</option>
            <option value="Divorciado">Divorciado</option>
        </select>

        <label for="conjuge">Cônjuge:</label>
        <input type="text" id="conjuge">

        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco">

        <label for="cep">CEP:</label>
        <input type="text" id="cep" maxlength="9" oninput="mascararCep()">
        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade">

        <label for="estado">Estado:</label>
        <input type="text" id="estado">

        <label for="complemento">Complemento:</label>
        <input type="text" id="complemento">

        <label for="email">Email:</label>
        <input type="text" id="email">

        <button type="button" onclick="criarCadastro()">
            Cadastrar
        </button>

    </form>

    <br>

    <a href="listagem.html">Ver usuários cadastrados</a>

    <script src="dados.js"></script>
    <script src="cadastro.js"></script>
</body>

</html>
